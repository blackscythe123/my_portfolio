<section class="v4-sec v4-writing" id="writing" aria-labelledby="writing-h">
  <div class="v4-in">
    <p class="v4-eye" data-reveal>Writing</p>
    <div class="v4-writing__head">
      <h2 class="v4-h2" id="writing-h" data-split>Notes from the repos</h2>
      <p class="v4-writing__lede" data-reveal>Technical write-ups of things I built, covering architecture, code and what was hard.</p>
    </div>
    <div class="posts-rail">
      <div class="posts" data-posts tabindex="0" aria-label="Latest posts, scroll sideways for more">
        <!-- POSTS -->
      </div>
    </div>
    <div class="posts-nav">
      <a class="btn btn--secondary btn--arrow v4-writing__all" href="%BLOG_URL%/">All writing</a>
      <div class="posts-nav__btns">
        <button type="button" class="posts-nav__btn" data-posts-prev aria-label="Previous posts">&larr;</button>
        <button type="button" class="posts-nav__btn" data-posts-next aria-label="More posts">&rarr;</button>
      </div>
    </div>
  </div>
</section>
